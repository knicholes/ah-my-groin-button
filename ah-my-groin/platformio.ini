; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pro8MHzatmega328]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino

; Exclude example files from build
build_src_filter = +<*> -<*example*>

; Build optimizations for production
build_flags = 
    -DDEBUG                   ; Enable debug output
    -Os                        ; Optimize for size
    -ffunction-sections        ; Enable dead code elimination
    -fdata-sections           ; Enable dead data elimination
    -Wl,--gc-sections         ; Link-time garbage collection
    -flto                     ; Link-time optimization
    
; Monitor settings    
monitor_speed = 9600
lib_deps = dfrobot/DFRobotDFPlayerMini@^1.0.6
