; PlatformIO project configuration for v2 firmware
;
; Build:    cd v2/firmware && pio run
; Upload:   cd v2/firmware && pio run -t upload
;           (requires FTDI cable connected to the Pro Mini's 6-pin header)
; Monitor:  cd v2/firmware && pio device monitor
;
; v2 has no DFPlayer library dependency — the trigger is a plain GPIO pulse.

[platformio]
src_dir = .

[env:pro8MHzatmega328]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino

build_flags =
    -DDEBUG
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -flto

monitor_speed = 9600
